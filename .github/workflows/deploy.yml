name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # 如果你的預設分支叫 master，請改成 master

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 拉取程式碼
        uses: actions/checkout@v4

      - name: 2. 將 Secret 網址注入 HTML
        env:
          GAS_URL: ${{ secrets.GAS_WEB_APP_URL }}
        run: |
          sed "s|___GAS_URL_PLACEHOLDER___|${GAS_URL}|g" index.template.html > index.html

      - name: 3. 自動部署至 GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          exclude_assets: '.github,index.template.html'
